<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="eDNAtlas: a living map of environmental DNA, machine-readable for the scientists who generate it and human-readable for everyone who lives with the results.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%233987e5' stroke-width='1.8' stroke-linecap='round'%3E%3Cpath d='M6 2c0 5 12 5 12 10S6 17 6 22'/%3E%3Cpath d='M18 2c0 5-12 5-12 10s12 5 12 10'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<title>eDNAtlas · Reading the ocean, one drop at a time</title>
<style>
/* ============================================================
   eDNAtlas — interactive pitch deck
   Palette validated with dataviz/scripts/validate_palette.js
   (dark mode, surface #0e1a24 — all six checks PASS)
   ============================================================ */
:root{
  /* surfaces */
  --plane:      #060e15;
  --surface-1:  #0e1a24;
  --surface-2:  #142433;
  --surface-3:  #1b3042;
  /* ink */
  --ink:        #ffffff;
  --ink-2:      #b9c8d4;
  --ink-3:      #7d8f9e;
  --hair:       rgba(255,255,255,0.10);
  --hair-2:     rgba(255,255,255,0.16);
  /* categorical (validated order) */
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#9085e9;
  /* status — reserved, always paired with icon + label */
  --good:#0ca30c; --warning:#fab219; --serious:#ec835a; --critical:#d03b3b;
  /* sequential blue ramp */
  --b100:#cde2fb; --b250:#86b6ef; --b400:#3987e5; --b550:#1c5cab; --b700:#0d366b;
  --font:'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  background:var(--plane); color:var(--ink); font-family:var(--font);
  overflow:hidden; -webkit-font-smoothing:antialiased;
}
/* ---------- deck scaffolding ---------- */
#viewport{position:fixed; inset:0; display:grid; place-items:center; background:
  radial-gradient(1200px 700px at 50% -10%, #0d2233 0%, #060e15 62%);}
#stage{
  width:1280px; height:720px; position:relative;
  transform:scale(var(--s,1)); transform-origin:center center;
}
.slide{
  position:absolute; inset:0; padding:56px 72px;
  flex-direction:column;
  background:var(--plane);
  border:1px solid var(--hair); border-radius:18px;
  overflow:hidden;
}
.slide:not(.active){display:none !important}
.slide.active{display:flex; animation:fade .38s cubic-bezier(.22,.7,.3,1)}
@keyframes fade{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){.slide.active{animation:none}}

/* ---------- chrome ---------- */
#chrome{
  position:fixed; left:0; right:0; bottom:0; height:44px;
  display:flex; align-items:center; gap:16px; padding:0 20px;
  font-size:12px; color:var(--ink-3); z-index:40;
  background:linear-gradient(to top, rgba(6,14,21,.92), rgba(6,14,21,0));
}
#dots{display:flex; gap:6px; align-items:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--hair-2);border:0;cursor:pointer;padding:0;transition:.2s}
.dot:hover{background:var(--ink-3)}
.dot[aria-current="true"]{background:var(--s1); width:20px; border-radius:4px}
#counter{font-variant-numeric:tabular-nums; letter-spacing:.04em}
#hint{margin-left:auto; letter-spacing:.02em}
kbd{background:var(--surface-2); border:1px solid var(--hair-2); border-radius:4px;
  padding:1px 5px; font:inherit; font-size:11px; color:var(--ink-2)}
#bar{position:fixed;top:0;left:0;height:2px;background:var(--s1);z-index:41;transition:width .32s ease}

/* ---------- typography ---------- */
.eyebrow{
  font-size:12px; letter-spacing:.16em; text-transform:uppercase;
  color:var(--s1); font-weight:650; margin-bottom:14px;
  display:flex; align-items:center; gap:9px;
}
.eyebrow::before{content:""; width:22px; height:1px; background:var(--s1); opacity:.7}
h1{font-size:76px; line-height:1.02; letter-spacing:-.032em; font-weight:680}
h2{font-size:42px; line-height:1.1; letter-spacing:-.022em; font-weight:660; margin-bottom:12px}
h3{font-size:17px; font-weight:640; letter-spacing:-.005em; margin-bottom:6px}
p,li{font-size:16.5px; line-height:1.55; color:var(--ink-2)}
.lede{font-size:21px; line-height:1.5; color:var(--ink-2); max-width:74ch}
.small{font-size:13px; color:var(--ink-3); line-height:1.5}
.tiny{font-size:11.5px; color:var(--ink-3); letter-spacing:.02em}
strong{color:var(--ink); font-weight:640}
em{font-style:normal; color:var(--s1); font-weight:600}

/* ---------- layout helpers ---------- */
.row{display:flex; gap:20px}
.col{display:flex; flex-direction:column}
.grow{flex:1; min-height:0}
.center{justify-content:center}
.spread{justify-content:space-between}
.g2{display:grid; grid-template-columns:1fr 1fr; gap:20px}
.g3{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
.g4{display:grid; grid-template-columns:repeat(4,1fr); gap:14px}
.card{
  background:var(--surface-1); border:1px solid var(--hair);
  border-radius:14px; padding:22px 24px;
}
.card.tight{padding:16px 18px}

/* ---------- stat tiles ---------- */
.stat{display:flex; flex-direction:column; gap:5px}
.stat .v{font-size:52px; font-weight:680; letter-spacing:-.035em; line-height:1}
.stat .k{font-size:13.5px; color:var(--ink-2); font-weight:560}
.stat .n{font-size:12px; color:var(--ink-3); line-height:1.45}

/* ---------- map ---------- */
#mapwrap{position:relative; background:var(--surface-1); border:1px solid var(--hair);
  border-radius:14px; overflow:hidden}
#mapwrap svg{display:block; width:100%; height:100%}
.site{cursor:pointer}
.site .hit{fill:transparent}
.site .ring{fill:none; stroke-width:2; opacity:.9}
.site .core{stroke:var(--surface-1); stroke-width:2}
.site .pulse{fill:none; stroke-width:2; opacity:0; transform-box:fill-box; transform-origin:center}
.site.on .pulse{animation:pulse 2.4s ease-out infinite}
@keyframes pulse{0%{opacity:.55; r:9}70%{opacity:0; r:26}100%{opacity:0; r:26}}
@media (prefers-reduced-motion:reduce){.site.on .pulse{animation:none}}
.site .lbl{font-size:11.5px; fill:var(--ink-3); font-weight:560; pointer-events:none}
.site.sel .lbl{fill:var(--ink); font-weight:640}
.site:focus{outline:none}
.site:focus-visible .halo,.site.sel .halo{stroke:var(--ink);stroke-width:1.5;fill:none;opacity:.85}
.halo{opacity:0}

/* ---------- detail panel ---------- */
#panel{width:400px; flex:0 0 400px}
.gauge-row{display:flex; align-items:center; gap:18px}
.pill{
  display:inline-flex; align-items:center; gap:7px; font-size:12px; font-weight:640;
  padding:4px 10px; border-radius:999px; border:1px solid var(--hair-2);
  background:var(--surface-2); color:var(--ink);
}
.pill .ic{font-size:12px; line-height:1}
.kv{display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--hair)}
.kv:last-child{border-bottom:0}
.kv .k{font-size:13px; color:var(--ink-3)}
.kv .v{font-size:13px; color:var(--ink); font-weight:600; font-variant-numeric:tabular-nums}

/* ---------- bars ---------- */
.bar-track{display:block; height:8px; background:var(--surface-2); border-radius:4px; overflow:hidden}
.bar-fill{display:block; height:8px; border-radius:4px; transition:width .7s cubic-bezier(.22,.7,.3,1)}
.lb-row{display:grid; grid-template-columns:26px 1fr 168px 46px; gap:12px; align-items:center;
  padding:9px 0; border-bottom:1px solid var(--hair)}
.lb-row:last-child{border-bottom:0}
.lb-rank{font-size:12px; color:var(--ink-3); font-variant-numeric:tabular-nums; text-align:right}
.lb-name{font-size:14px; color:var(--ink-2)}
.lb-row.me .lb-name{color:var(--ink); font-weight:640}
.lb-val{font-size:14px; font-weight:640; text-align:right; font-variant-numeric:tabular-nums}

/* ---------- sequence strip ---------- */
.seq{display:flex; gap:2px; height:34px; align-items:flex-end}
.seq i{flex:1; border-radius:2px 2px 0 0; display:block; transition:height .5s ease}

/* ---------- pipeline ---------- */
.pipe{display:grid; grid-template-columns:repeat(5,1fr); gap:10px; align-items:stretch}
.step{background:var(--surface-1); border:1px solid var(--hair); border-radius:12px;
  padding:16px 15px; position:relative; display:flex; flex-direction:column; gap:7px}
.step .n{font-size:11px; font-weight:700; color:var(--s1); letter-spacing:.1em}
.step h3{font-size:15px; margin:0}
.step p{font-size:12.5px; line-height:1.45}
.step::after{content:"›"; position:absolute; right:-11px; top:50%; transform:translateY(-50%);
  color:var(--ink-3); font-size:20px; z-index:2}
.step:last-child::after{display:none}

/* ---------- misc ---------- */
.tag{display:inline-block; font-size:11px; font-weight:620; letter-spacing:.05em;
  padding:3px 8px; border-radius:5px; background:var(--surface-2);
  border:1px solid var(--hair-2); color:var(--ink-2)}
.quote{border-left:2px solid var(--s1); padding-left:20px; font-size:23px; line-height:1.45;
  color:var(--ink); font-weight:520; letter-spacing:-.01em}
.legend{display:flex; gap:16px; flex-wrap:wrap; align-items:center}
.legend span{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2)}
.swatch{width:9px;height:9px;border-radius:2px;display:inline-block}
.chk{color:var(--good); font-weight:700}
.note{font-size:11.5px; color:var(--ink-3); font-style:normal}
.brandmark{display:flex; align-items:center; gap:11px}
.brandmark .helix{width:30px;height:30px}
table.tv{width:100%; border-collapse:collapse; font-size:12.5px}
table.tv th{text-align:left; color:var(--ink-3); font-weight:600; padding:5px 8px 5px 0;
  border-bottom:1px solid var(--hair-2); font-size:11.5px; letter-spacing:.03em; text-transform:uppercase}
table.tv td{padding:6px 8px 6px 0; border-bottom:1px solid var(--hair); color:var(--ink-2);
  font-variant-numeric:tabular-nums}
table.tv td:first-child{color:var(--ink)}
</style>
</head>
<body>
<div id="bar"></div>
<div id="viewport"><div id="stage"><!-- slides injected --></div></div>
<div id="chrome">
  <span id="counter">01 / 13</span>
  <div id="dots"></div>
  <span id="hint"><kbd>←</kbd> <kbd>→</kbd> navigate · <kbd>F</kbd> fullscreen · click the map on slide 5</span>
</div>

<script>
/* =========================================================================
   DEMO DATA — illustrative values modelled on Southern California coastal
   sites. Labelled as sample data everywhere it appears in the deck.
   ========================================================================= */
const TIER = {
  good:     {label:'Healthy',    color:'var(--good)',     ic:'●', hex:'#0ca30c'},
  warning:  {label:'Watch',      color:'var(--warning)',  ic:'▲', hex:'#fab219'},
  serious:  {label:'Stressed',   color:'var(--serious)',  ic:'◆', hex:'#ec835a'},
  critical: {label:'Degraded',   color:'var(--critical)', ic:'■', hex:'#d03b3b'}
};

const SITES = [
  { id:'ml',  name:'Malibu Lagoon',        x:238, y:84,  score:62, tier:'warning',
    taxa:184, novel:11, reads:'1.9M', trend:'+4', date:'2026-07-28',
    plain:'Mixed. Native fish and invertebrate DNA is present, but freshwater runoff signatures dominate after storms, and the community shifts toward pollution-tolerant species each winter.',
    flags:[['Indicator present','Tidewater goby DNA detected','good'],['Runoff signal','Elevated terrestrial plant + livestock markers','warning']] },
  { id:'smb', name:'Santa Monica Bay',     x:300, y:168, score:74, tier:'good',
    taxa:241, novel:9, reads:'2.6M', trend:'+7', date:'2026-08-02',
    plain:'Recovering. Species richness is up 7 points year over year, and forage-fish DNA (anchovy, sardine, smelt) is showing up consistently across all three depth strata.',
    flags:[['Recovery signal','Forage fish DNA up 22% vs 2024','good'],['Watch','Two non-native tunicates detected','warning']] },
  { id:'mdr', name:'Marina del Rey',       x:348, y:224, score:51, tier:'warning',
    taxa:143, novel:6, reads:'1.4M', trend:'-2', date:'2026-08-04',
    plain:'Under pressure. Enclosed harbour water holds low diversity dominated by fouling organisms. The DNA here looks like a marina, not a bay, which is expected, but the trend is flat.',
    flags:[['Low diversity','Bottom quartile for enclosed harbours','warning'],['Invasive','Watersipora subatra confirmed','serious']] },
  { id:'bc',  name:'Ballona Creek Outfall',x:374, y:252, score:33, tier:'critical',
    taxa:78,  novel:4, reads:'1.1M', trend:'-6', date:'2026-08-04',
    plain:'Degraded. Sequence diversity collapses within 200 m of the outfall. Sensitive taxa are absent from every replicate; the community is dominated by four tolerant genera.',
    flags:[['Sensitive taxa absent','0 of 9 indicator species detected','critical'],['Trend','Down 6 points over 24 months','critical']] },
  { id:'kh',  name:'King Harbor',          x:344, y:296, score:58, tier:'warning',
    taxa:167, novel:8, reads:'1.7M', trend:'+1', date:'2026-07-30',
    plain:'Holding steady. A working harbour with a surprisingly intact fish assemblage. The submarine canyon nearby keeps flushing water through and refreshing the community.',
    flags:[['Unexpected find','Giant sea bass eDNA, 3 replicates','good'],['Watch','Seasonal hypoxia signature in July','warning']] },
  { id:'pv',  name:'Palos Verdes Kelp',    x:316, y:344, score:88, tier:'good',
    taxa:312, novel:16, reads:'3.4M', trend:'+9', date:'2026-08-01',
    plain:'Thriving. The richest site in the network. Restored kelp canopy is carrying a full trophic stack, with DNA from grazers, predators and their predators all present in the same litre.',
    flags:[['Top of network','#1 of 8 for species richness','good'],['Novel sequences','16% unassigned, likely undescribed taxa','good']] },
  { id:'lbh', name:'Long Beach Harbor',    x:430, y:384, score:44, tier:'serious',
    taxa:106, novel:5, reads:'1.3M', trend:'-3', date:'2026-08-03',
    plain:'Stressed. Port traffic and sediment disturbance show up clearly: high turnover between sampling events, low persistence of any one community, and a rising invasive fraction.',
    flags:[['Invasive load','4 non-native species, up from 2','serious'],['Instability','Community turnover 2.4× network median','serious']] },
  { id:'cc',  name:'Catalina Channel',     x:148, y:362, score:91, tier:'good',
    taxa:298, novel:19, reads:'3.1M', trend:'+3', date:'2026-07-26',
    plain:'Reference condition. This is the benchmark the rest of the network is scored against: deep, offshore, and consistently the least human-modified community in the dataset.',
    flags:[['Reference site','Baseline for network scoring','good'],['Novel sequences','19% unassigned, highest in network','good']] }
];

/* ---------- tiny helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const el = (t,c,h)=>{const n=document.createElement(t); if(c)n.className=c; if(h!=null)n.innerHTML=h; return n;};
const tierOf = s => s>=70?'good' : s>=55?'warning' : s>=40?'serious' : 'critical';

/* ---------- SVG gauge (arc, single hue by status + label; never colour alone) ---------- */
function gauge(score, tier, size=104){
  const r=44, c=Math.PI*r, pct=Math.max(0,Math.min(100,score))/100;
  return `<svg width="${size}" height="${size*0.66}" viewBox="0 0 104 68" aria-hidden="true">
    <path d="M8 60 A44 44 0 0 1 96 60" fill="none" stroke="var(--surface-2)" stroke-width="8" stroke-linecap="round"/>
    <path d="M8 60 A44 44 0 0 1 96 60" fill="none" stroke="${TIER[tier].hex}" stroke-width="8"
      stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-pct)}"
      style="transition:stroke-dashoffset .8s cubic-bezier(.22,.7,.3,1)"/>
  </svg>`;
}

/* ---------- fake-but-deterministic sequence strip ---------- */
function seqStrip(seed, n=44, colorVar='var(--s1)'){
  let out='', x=seed*7919;
  for(let i=0;i<n;i++){
    x=(x*1103515245+12345)&0x7fffffff;
    const h=18+((x>>7)%82);
    const dim=((x>>3)%5===0);
    out+=`<i style="height:${h}%;background:${dim?'var(--surface-3)':colorVar};opacity:${dim?1:.55+((x>>11)%45)/100}"></i>`;
  }
  return out;
}

/* =========================================================================
   SLIDES
   ========================================================================= */
const slides = [];

/* --- 1 · TITLE --- */
slides.push(`
<div class="slide col spread">
  <div class="brandmark">
    <svg class="helix" viewBox="0 0 24 24" fill="none" stroke="var(--s1)" stroke-width="1.7" stroke-linecap="round">
      <path d="M6 2c0 5 12 5 12 10S6 17 6 22"/><path d="M18 2c0 5-12 5-12 10s12 5 12 10"/>
      <path d="M7.6 6h8.8M7 10h10M7 14h10M7.6 18h8.8" opacity=".55"/>
    </svg>
    <span style="font-size:17px;font-weight:660;letter-spacing:-.01em">eDNAtlas</span>
  </div>
  <div>
    <h1 style="max-width:17ch">Every drop of<br>water is a<br><span style="color:var(--s1)">census.</span></h1>
    <p class="lede" style="margin-top:26px;max-width:56ch">
      A living map of environmental DNA: machine-readable for the scientists who
      generate it, human-readable for everyone who lives with the results.
    </p>
  </div>
  <div class="row spread" style="align-items:flex-end">
    <div class="row" style="gap:34px">
      <div><div class="tiny" style="margin-bottom:4px">SAMPLE SITES LIVE</div><div style="font-size:22px;font-weight:660">8</div></div>
      <div><div class="tiny" style="margin-bottom:4px">SEQUENCES INDEXED</div><div style="font-size:22px;font-weight:660">16.5M</div></div>
      <div><div class="tiny" style="margin-bottom:4px">OPEN API</div><div style="font-size:22px;font-weight:660">Day one</div></div>
    </div>
    <div class="small" style="text-align:right">
      Hackathon build · 2026<br><span class="tiny">Adrian &amp; team</span>
    </div>
  </div>
</div>`);

/* --- 2 · THE INVISIBLE MAJORITY --- */
slides.push(`
<div class="slide col">
  <div class="eyebrow">The problem, part one</div>
  <h2>Most of the ocean has never<br>introduced itself.</h2>
  <p class="lede" style="margin-bottom:30px">
    Traditional surveys count what a diver can see or a net can catch. That method has been
    running for two centuries and it is still nowhere close to done.
  </p>
  <div class="g3" style="margin-bottom:22px">
    <div class="card stat">
      <div class="v" style="color:var(--s1)">~250k</div>
      <div class="k">marine species formally described</div>
      <div class="n">The total catalogued by science to date.</div>
    </div>
    <div class="card stat">
      <div class="v" style="color:var(--s4)">~2M</div>
      <div class="k">marine species estimated to exist</div>
      <div class="n">Leaving roughly 87% of ocean life unnamed.</div>
    </div>
    <div class="card stat">
      <div class="v" style="color:var(--s3)">1 L</div>
      <div class="k">of seawater to sample a whole community</div>
      <div class="n">eDNA reads the shed cells of everything that passed through.</div>
    </div>
  </div>
  <div class="card tight row" style="gap:18px;align-items:center">
    <span class="tag" style="border-color:var(--s3);color:var(--s3)">THE SHIFT</span>
    <p style="font-size:15px">
      Environmental DNA already solved the <strong>collection</strong> problem. Sampling is cheap,
      non-invasive, and repeatable by a volunteer with a bottle and a filter.
      <strong>So why can almost nobody use the results?</strong>
    </p>
  </div>
  <p class="note" style="margin-top:20px">Species estimates: Ocean Census / marine biodiversity literature. See sources slide.</p>
</div>`);

/* --- 3 · THE LAST MILE --- */
slides.push(`
<div class="slide col">
  <div class="eyebrow">The problem, part two</div>
  <h2>eDNA has a last-mile problem.</h2>
  <div class="quote" style="margin:8px 0 30px">
    “Environmental DNA has advanced scientifically faster than the<br>
    infrastructure needed to manage and reuse it at scale.”
    <div class="small" style="margin-top:10px;font-weight:500">Global Biodiversity Information Facility (GBIF)</div>
  </div>
  <div class="g2 grow">
    <div class="card col" style="gap:14px">
      <div class="row" style="gap:10px;align-items:center">
        <span class="tag" style="border-color:var(--s2);color:var(--s2)">GAP 1</span>
        <h3 style="margin:0;font-size:19px">Machines can't find it</h3>
      </div>
      <p style="font-size:15px">Sequence data is scattered across supplementary tables, lab drives and
      incompatible archives. GBIF names three barriers directly:</p>
      <div style="display:flex;flex-direction:column;gap:9px">
        <div class="kv"><span class="k">No sequence-based search</span><span class="v">unsolved</span></div>
        <div class="kv"><span class="k">No taxonomic reinterpretation</span><span class="v">unsolved</span></div>
        <div class="kv"><span class="k">Fragmented reference libraries</span><span class="v">unsolved</span></div>
      </div>
    </div>
    <div class="card col" style="gap:14px">
      <div class="row" style="gap:10px;align-items:center">
        <span class="tag" style="border-color:var(--s5);color:var(--s5)">GAP 2</span>
        <h3 style="margin:0;font-size:19px">People can't read it</h3>
      </div>
      <p style="font-size:15px">Even when the data <em>is</em> open, it ships as this:</p>
      <div style="background:var(--surface-2);border:1px solid var(--hair);border-radius:8px;
        padding:12px 14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11.5px;
        color:var(--ink-3);line-height:1.6;overflow:hidden;white-space:nowrap">
        ASV_00412&nbsp;&nbsp;k__Eukaryota;p__Chordata;c__Actinopteri…<br>
        reads=8841&nbsp;&nbsp;pident=99.2&nbsp;&nbsp;evalue=3e-142<br>
        TACGGAGGATCCGAGCGTTATCCGGATTTATTGGGTTTAAAGGGT…
      </div>
      <p style="font-size:15px">A harbour commissioner, a fisher, a city council, a science teacher:
      all of them are the audience for this data, and <strong>none of them can act on it.</strong></p>
    </div>
  </div>
</div>`);

/* --- 4 · THESIS --- */

/* ---------- build the map ---------- */
function buildMap(){
  const wrap = $('#mapwrap'); if(!wrap) return;
  const pts = SITES.map(s=>{
    const t = TIER[s.tier];
    // hit area spans the marker AND its label — a ~28px tall row, not a pinpoint dot
    const lw = 22 + s.name.length * 6.7;
    return `<g class="site" data-id="${s.id}" tabindex="0" role="button"
             aria-label="${s.name}, health index ${s.score}, ${t.label}">
      <rect class="hit" x="${s.x-16}" y="${s.y-15}" width="${lw+18}" height="30" rx="6"/>
      <circle class="pulse" cx="${s.x}" cy="${s.y}" r="9" stroke="${t.hex}"/>
      <circle class="halo" cx="${s.x}" cy="${s.y}" r="15"/>
      <circle class="ring" cx="${s.x}" cy="${s.y}" r="10.5" stroke="${t.hex}" opacity=".45"/>
      <circle class="core" cx="${s.x}" cy="${s.y}" r="6" fill="${t.hex}"/>
      <text class="lbl" x="${s.x+17}" y="${s.y+4}">${s.name}</text>
    </g>`;
  }).join('');

  wrap.innerHTML = `<svg viewBox="0 0 720 480" preserveAspectRatio="xMidYMid slice" role="img"
      aria-label="Map of eight environmental DNA sampling sites along the Southern California coast">
    <defs>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#0d1f2e"/><stop offset="100%" stop-color="#0a1722"/>
      </linearGradient>
      <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
        <path d="M40 0H0V40" fill="none" stroke="rgba(255,255,255,0.045)" stroke-width="1"/>
      </pattern>
    </defs>
    <rect width="720" height="480" fill="url(#sea)"/>
    <rect width="720" height="480" fill="url(#grid)"/>
    <!-- bathymetric contours -->
    <path d="M-20 96 C 110 136, 190 214, 226 340 S 272 456, 300 500" fill="none"
          stroke="rgba(57,135,229,0.18)" stroke-width="1.5"/>
    <path d="M-20 34 C 140 84, 240 192, 276 330 S 332 448, 370 500" fill="none"
          stroke="rgba(57,135,229,0.12)" stroke-width="1.5"/>
    <!-- mainland -->
    <path d="M720 0 L215 0 C 250 60, 300 120, 340 175 C 390 240, 420 260, 430 300
             C 442 348, 470 400, 480 480 L720 480 Z"
          fill="#16283a" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>
    <!-- santa catalina -->
    <path d="M92 408 C 118 388, 168 390, 202 404 C 228 416, 208 442, 168 442
             C 126 442, 78 424, 92 408 Z"
          fill="#16283a" stroke="rgba(255,255,255,0.20)" stroke-width="1.5"/>
    <text x="545" y="54" font-size="12" style="fill:#5b7387;letter-spacing:.16em;font-weight:600">LOS ANGELES</text>
    <text x="98" y="466" font-size="11" style="fill:#5b7387;letter-spacing:.13em;font-weight:600">SANTA CATALINA</text>
    <text x="26" y="40" font-size="11" style="fill:#4f6577;letter-spacing:.13em;font-weight:600">PACIFIC OCEAN</text>
    ${pts}
  </svg>`;

  wrap.querySelectorAll('.site').forEach(g=>{
    g.addEventListener('click', ()=>select(g.dataset.id));
    g.addEventListener('keydown', e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault(); select(g.dataset.id);} });
  });
  select('smb');
}

function select(id){
  const s = SITES.find(v=>v.id===id); if(!s) return;
  document.querySelectorAll('.site').forEach(g=>{
    const on = g.dataset.id===id;
    g.classList.toggle('sel', on);
    g.classList.toggle('on', on);
  });
  const t = TIER[s.tier];
  $('#panel').innerHTML = `
    <div>
      <div class="tiny" style="margin-bottom:5px">SAMPLED ${s.date} · ${s.reads} READS</div>
      <h3 style="font-size:22px;margin-bottom:12px">${s.name}</h3>
    </div>
    <div class="gauge-row">
      <div style="position:relative;flex:0 0 auto">
        ${gauge(s.score, s.tier, 116)}
        <div style="position:absolute;left:0;right:0;bottom:-2px;text-align:center;font-size:30px;font-weight:680;letter-spacing:-.03em">${s.score}</div>
      </div>
      <div class="col" style="gap:9px">
        <div class="pill" style="border-color:${t.hex}"><span class="ic" style="color:${t.hex}">${t.ic}</span>${t.label}</div>
        <div class="tiny">ECOSYSTEM HEALTH INDEX<br>${s.trend.startsWith('-')?'▼':'▲'} ${s.trend.replace('-','')} pts vs. 2024</div>
      </div>
    </div>
    <p style="font-size:14.5px;line-height:1.5;color:var(--ink)">${s.plain}</p>
    <div>
      <div class="tiny" style="margin-bottom:6px">COMMUNITY SIGNATURE · ${s.taxa} TAXA</div>
      <div class="seq">${seqStrip(s.score + s.taxa, 46, t.hex)}</div>
    </div>
    <div style="margin-top:2px">
      ${s.flags.map(f=>`<div class="kv" style="align-items:flex-start">
        <span class="k" style="display:flex;gap:7px"><span style="color:${TIER[f[2]].hex}">${TIER[f[2]].ic}</span>
        <span><span style="color:var(--ink);font-weight:600">${f[0]}</span><br>${f[1]}</span></span></div>`).join('')}
    </div>
    <div class="row" style="gap:8px;margin-top:auto;padding-top:6px">
      <span class="tag">↓ FASTQ</span><span class="tag">↓ ASV TABLE</span><span class="tag">↗ DARWIN CORE</span>
    </div>`;
}

/* ---------- leaderboard ---------- */
function buildLeaderboard(){
  const host = $('#lb'); if(!host) return;
  const ranked = [...SITES].sort((a,b)=>b.score-a.score);
  host.innerHTML = ranked.map((s,i)=>{
    const t=TIER[s.tier];
    return `<div class="lb-row${s.id==='smb'?' me':''}">
      <span class="lb-rank">${i+1}</span>
      <span class="lb-name">${s.name}${s.id==='smb'?' <span class="tiny">· your site</span>':''}</span>
      <span class="bar-track"><span class="bar-fill" data-w="${s.score}" style="width:0;background:${t.hex}"></span></span>
      <span class="lb-val" style="color:${t.hex}">${s.score}</span>
    </div>`;
  }).join('');
}

/* ---------- diversity bars (one hue — single measure) ---------- */
function buildDiversity(){
  const host = $('#diversity'); if(!host) return;
  const ranked=[...SITES].sort((a,b)=>b.taxa-a.taxa), max=ranked[0].taxa;
  host.innerHTML = ranked.map(s=>`
    <div class="lb-row" style="grid-template-columns:1fr 120px 42px">
      <span class="lb-name" style="font-size:13px">${s.name}</span>
      <span class="bar-track"><span class="bar-fill" data-w="${Math.round(s.taxa/max*100)}" style="width:0;background:var(--s1)"></span></span>
      <span class="lb-val" style="font-size:13px">${s.taxa}</span>
    </div>`).join('');
}

/* ---------- unique findings ---------- */
const FINDS = [
  ['good','Giant sea bass',"Stereolepis gigas",'King Harbor','Species of concern, 3/3 replicates. No dive survey has recorded it here since 2019.'],
  ['good','19% unassigned sequences',"—",'Catalina Channel','Highest novel fraction in the network. Strong candidate pool for undescribed taxa.'],
  ['serious','Watersipora subatra',"bryozoan",'Marina del Rey','Non-native fouling species, first confirmed detection at this site.'],
  ['critical','Nine indicator taxa absent',"—",'Ballona Creek','Zero of nine sensitive indicator species detected in any replicate.'],
  ['good','Forage-fish rebound',"Engraulis · Sardinops",'Santa Monica Bay','Anchovy and sardine DNA up 22% against the 2024 baseline.']
];
function buildFinds(){
  const host=$('#finds'); if(!host) return;
  host.innerHTML = FINDS.map(f=>{
    const t=TIER[f[0]];
    return `<div class="kv" style="align-items:flex-start;padding:10px 0">
      <span class="k" style="display:flex;gap:9px;align-items:flex-start">
        <span style="color:${t.hex};font-size:11px;line-height:1.5">${t.ic}</span>
        <span><span style="color:var(--ink);font-weight:640;font-size:14px">${f[1]}</span>
        ${f[2]!=='—'?`<span class="tiny" style="font-style:italic"> ${f[2]}</span>`:''}
        <br><span style="font-size:12.5px;line-height:1.45;display:block;margin-top:2px">${f[4]}</span></span>
      </span>
      <span class="v" style="font-size:12px;color:var(--ink-3);white-space:nowrap">${f[3]}</span>
    </div>`;
  }).join('');
}

/* ---------- score components ---------- */
const COMPONENTS = [
  ['Species richness','Distinct taxa vs. habitat-matched reference', 25, 82],
  ['Community evenness','Shannon index: is one species dominating?', 20, 71],
  ['Indicator taxa','Presence of sensitive species that leave first', 20, 78],
  ['Non-native load','Share of reads from non-native species (inverted)', 15, 64],
  ['Temporal trend','Direction of change over the last 24 months', 20, 69]
];
function buildComponents(){
  const host=$('#score-components'); if(!host) return;
  host.innerHTML = COMPONENTS.map(c=>`
    <div class="lb-row" style="grid-template-columns:1fr 54px 150px 40px;padding:11px 0">
      <span><span style="color:var(--ink);font-weight:620;font-size:14px">${c[0]}</span>
        <br><span class="tiny">${c[1]}</span></span>
      <span class="tiny" style="text-align:right">${c[2]}% wt</span>
      <span class="bar-track"><span class="bar-fill" data-w="${c[3]}" style="width:0;background:var(--s1)"></span></span>
      <span class="lb-val" style="font-size:13px">${c[3]}</span>
    </div>`).join('') +
    `<div class="row spread" style="padding-top:14px;margin-top:6px;border-top:1px solid var(--hair-2)">
      <span style="font-size:14px;color:var(--ink-2)">Weighted composite</span>
      <span style="font-size:22px;font-weight:680;color:var(--good)">74 <span style="font-size:13px;font-weight:600;color:var(--ink-2)">· ● Healthy</span></span>
    </div>`;
}

/* =========================================================================
   NAVIGATION
   ========================================================================= */
let i = 0;
const dots = $('#dots');
slideEls.forEach((_,n)=>{
  const b = el('button','dot');
  b.setAttribute('aria-label','Slide '+(n+1));
  b.onclick = ()=>go(n);
  dots.appendChild(b);
});

function animateBars(slide){
  slide.querySelectorAll('.bar-fill').forEach((b,k)=>{
    b.style.width='0';
    setTimeout(()=>{ b.style.width = b.dataset.w+'%'; }, 60+k*45);
  });
}

function go(n){
  i = Math.max(0, Math.min(slideEls.length-1, n));
  slideEls.forEach((s,k)=>s.classList.toggle('active', k===i));
  [...dots.children].forEach((d,k)=>d.setAttribute('aria-current', k===i));
  $('#counter').textContent = String(i+1).padStart(2,'0')+' / '+String(slideEls.length).padStart(2,'0');
  $('#bar').style.width = ((i+1)/slideEls.length*100)+'%';
  animateBars(slideEls[i]);
}

document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){e.preventDefault(); go(i+1);}
  else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault(); go(i-1);}
  else if(e.key==='Home'){go(0);} else if(e.key==='End'){go(slideEls.length-1);}
  else if(e.key==='f'||e.key==='F'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen?.();
    else document.exitFullscreen?.();
  }
  else if(/^[1-9]$/.test(e.key)) go(parseInt(e.key,10)-1);
});

function fit(){
  const pad = 34;
  const s = Math.min((innerWidth-pad*2)/1280, (innerHeight-pad*2-44)/720);
  stage.style.setProperty('--s', s);
}
addEventListener('resize', fit);

buildMap(); buildLeaderboard(); buildDiversity(); buildFinds(); buildComponents();
fit(); go(0);
</script>
</body>
</html>
